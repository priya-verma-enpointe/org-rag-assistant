
services:
  # 1. Database Service (PostgreSQL with pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/rag_db
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: always

  # 3. React Frontend Service 
